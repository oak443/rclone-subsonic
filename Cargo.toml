[package]
name = "rclone-subsonic"
version = "0.1.0"
edition = "2024"

[dependencies]
# 异步运行时与 Web 框架
tokio = { version = "1", features = ["full"] }
axum = "0.8"

# 序列化与 XML
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.31"

# HTTP 客户端（请求本地 rclone HTTP / RC）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "stream"] }

# 数据库
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }

# 配置、CLI、日志
clap = { version = "4", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

# 协议 / 工具
md-5 = "0.10"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
bytes = "1"
futures-util = "0.3"
mime_guess = "2"
percent-encoding = "2"
url = "2"
encoding_rs = "0.8"
chardetng = "0.1"
chrono = "0.4"
tower-http = { version = "0.6", features = ["cors"] }
